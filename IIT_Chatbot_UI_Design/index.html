<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hawk | OSL</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <script type="module" src="/assets/js/app.js"></script>
</head>
<body>
  <div id="app">

    <header id="top-bar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">OSL</div>
        <div class="brand-info">
          <span class="brand-name">Office of Student Life</span>
          <span class="brand-sub">Illinois Institute of Technology</span>
        </div>
      </div>
      <button id="reset" title="Start a new conversation">New chat</button>
    </header>

    <div id="chat-body">
      <div id="messages" role="log" aria-live="polite" aria-label="Conversation"></div>

      <div id="chips" aria-label="Example questions">
        <button data-question="How do I start a new student organization?">Start a student org</button>
        <button data-question="How do I reserve a space for an event?">Reserve event space</button>
        <button data-question="What is the Finance Board funding process?">Finance Board funding</button>
        <button data-question="What does the 312 platform do?">About the 312 platform</button>
      </div>

      <div id="options" aria-label="Next steps" hidden>
        <button id="choose-email" type="button">
          <span class="opt-icon" aria-hidden="true">✉</span>
          <span class="opt-body">
            <strong>Email OSL</strong>
            <small>Draft a message to OSL staff</small>
          </span>
        </button>
      </div>
    </div>

    <div id="input-wrap">
      <div id="status" role="status" aria-live="polite"></div>
      <div id="error" role="alert" hidden></div>
      <button id="retry" hidden>Try again</button>
      <form id="composer">
        <label class="sr-only" for="message">Message Hawk</label>
        <textarea id="message" rows="1" maxlength="4000" autocomplete="off"
          placeholder="Ask about student orgs, events, funding…" required></textarea>
        <button id="send" type="submit" aria-label="Send message">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M9 15V3M3 9l6-6 6 6" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>
      <p class="input-note">Hawk uses the OSL Student Organization Handbook. Do not share passwords or student IDs.</p>
    </div>

  </div>

  <!-- Keep these IDs so hawk.js event listeners don't crash; they are never shown -->
  <div id="chat" hidden></div>
  <div id="launcher" hidden></div>
  <div id="close" hidden></div>
  <div id="choose-diagnose" hidden></div>

</body>
</html>
